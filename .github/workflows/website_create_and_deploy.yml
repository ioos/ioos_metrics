# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Create and Deploy Prod HTML site

# no permissions by default
permissions: {}

# Includes building automatically when either of the relevant JSON files update on the main branch or on the push of a button
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

  schedule:
    - cron: "0 12 1,15,28 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
      with:
        manifest-path: pyproject.toml

    - name: create HTML file
      shell: bash -l {0}
      run: |
        pixi run build_site

    - name: Deploy 🚀
      if: github.ref == 'refs/heads/main'
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
      with:
        folder: website/deploy # The folder the action should deploy.
        repository-name: ioos/ioos_metrics
